<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" />
    <script>
      // Apply the theme before first paint (no flash). The setting lives in IndexedDB,
      // which is async, so the app mirrors it to localStorage for this script.
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('recall.theme') || 'system';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="description" content="Spaced-repetition flashcards that work offline." />
    <link rel="icon" href="/brand/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>Ace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
