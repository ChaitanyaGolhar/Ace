# Local Postgres for development and tests. Port 54329 (not 5432) to avoid clashing
# with a locally installed Postgres. See DECISIONS.md D-001.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall_dev
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recall -d recall_dev']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
